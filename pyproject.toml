[project]
name = "xeofs"
version = "3.0.6"
description = "Comprehensive EOF analysis in Python with xarray: A versatile, multidimensional, and scalable tool for advanced climate data analysis"
authors = [
    {name = "Niclas Rieger", email = "niclasrieger@gmail.com"},
    {name = "Samuel J. Levang", email = "slevang@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.24",
  "pandas>=2",
  "xarray>=2024.10.0",
  "scikit-learn>=1.0.2",
  "tqdm>=4.64.0",
  "dask>=2023.0.1",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
complete = ["xeofs[etc,io]"]
dev = [
  "build>=1.0.0",
  "ruff==0.17.2",
  "pytest>=7",
  "pytest-xdist>=3",
  "coverage>=6",
  "pre-commit>=3",
  "nbstripout>=0.6",
  "pooch>=1.6.0",
]
docs = [
  "rpy2>=3.5",
  "sphinx-gallery>=0.14",
  "sphinx-design>=0.6",
  "sphinx-copybutton>=0.5",
  "nbsphinx>=0.9",
  "pydata-sphinx-theme>=0.15",
  "sphinx>=8",
  "nbconvert>=7.9",
  "myst-parser>=3.0",
  "matplotlib>=3.4",
  "seaborn>=0.11",
  "cartopy>=0.22",
  "pooch>=1.6.0",
  "ipython>=8.14",
  "ipykernel>=6.23",
]
etc = [
  "numba>=0.57",
  "statsmodels>=0.14.0",
]
io = [
  "h5netcdf>=1.0.0",
  "h5py>=3.7.0",
  "netcdf4>=1.5.8",
  "zarr>=2.14.0",
]

[project.urls]
homepage = "https://github.com/xarray-contrib/xeofs"
repository = "https://github.com/xarray-contrib/xeofs"
documentation = "https://xeofs.readthedocs.io/en/latest/"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm>=7",
]

[tool.ruff]
target-version = "py310"
required-version = "==0.17.2"

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
version_source = "tag"
commit_message = "chore(release): v{version}"
build_command = """
    python -m pip install build~=0.10.0
    python -m build .
"""
branch = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
requires-pixi = ">=0.82.1"

[tool.pixi.pypi-dependencies]
xeofs = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev", "complete", "py311", "test"], solve-group = "py311" }
minimal-py311 = { features = ["dev", "py311", "test"], solve-group = "py311" }
minimal-py312 = { features = ["dev", "py312", "test"], solve-group = "py312" }
complete-py312 = { features = ["dev", "complete", "py312", "test"], solve-group = "py312" }
lowest = { features = ["lowest", "test"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs", "complete", "py311"] }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.dev.tasks]
build = "python -m build"
pre-commit = "pre-commit"

[tool.pixi.feature.test.tasks]
test = "pytest -n auto"
test-readme = "pytest --doctest-glob=README.md README.md"
coverage = "coverage run -m pytest -n auto"
coverage-report = "coverage report -m && coverage xml"

# Pixi's PyPI resolver does not expose lowest-direct. Keep that compatibility
# check isolated from the locked development environments.
[tool.pixi.feature.lowest.dependencies]
python = "3.10.*"
uv = ">=0.5"

[tool.pixi.feature.lowest.tasks]
install-lowest = "uv pip install --system --python python --resolution lowest-direct -r pyproject.toml"

[tool.pixi.feature.lint.dependencies]
# Keep in sync with the dev extra and .pre-commit-config.yaml.
ruff = "==0.17.2"

[tool.pixi.feature.lint.tasks]
lint = "ruff check"
format = "ruff format"
format-check = "ruff format --check"

[tool.pixi.feature.docs]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.feature.docs.dependencies]
cartopy = ">=0.22"
pandoc = ">=2"
rpy2 = ">=3.5"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -b html docs docs/_build/html"
