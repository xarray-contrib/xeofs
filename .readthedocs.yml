version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.11"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi 0.82.1
      - asdf global pixi 0.82.1
    install:
      - pixi install --locked -e docs
    build:
      html:
        - pixi run --locked -e docs sphinx-build -T -b html docs "$READTHEDOCS_OUTPUT/html"
