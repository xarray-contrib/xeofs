# Test locked Pixi environments and the lowest supported PyPI dependencies.

name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab


jobs:
  test:
    name: ${{ matrix.environment }} ${{ matrix.extras }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: lowest
            extras: '[dev]'
          - environment: lowest
            extras: '[dev,complete]'
            doctest: '--doctest-glob=README.md'
          - environment: minimal-py311
          - environment: default # Python 3.11 with complete dependencies
            doctest: '--doctest-glob=README.md'
          - environment: minimal-py312
          - environment: complete-py312
            doctest: '--doctest-glob=README.md'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: ${{ matrix.environment }}
          locked: true
          # Do not cache packages installed outside the lockfile by uv.
          cache: ${{ matrix.environment != 'lowest' }}

      - name: Install lowest supported dependencies
        if: matrix.environment == 'lowest'
        run: pixi run --locked -e lowest install-lowest ".${{ matrix.extras }}"

      - name: Build wheel and source distribution
        if: matrix.environment == 'default'
        run: pixi run --locked build

      - name: Execute Tests
        run: |
          pixi run --locked -e ${{ matrix.environment }} coverage ${{ matrix.doctest }}
          pixi run --locked -e ${{ matrix.environment }} coverage-report

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
